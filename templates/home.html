
{% extends 'base.html'%}
{% load static %}

{% block content %}


<!-- ========================= SECTION MAIN ========================= -->
<section class="section-intro padding-y-sm">
<div class="container">

	<div style="position: relative; width: 100%; max-width: 1000px; margin: auto; overflow: hidden;">

	  <!-- Carousel Container -->
	  <div id="carousel" style="display: flex; overflow-x: auto; scroll-behavior: smooth; gap: 20px; padding: 10px; scrollbar-width: none; -ms-overflow-style: none;">
	    <img src="{% static 'images/banners/1st.png' %}" alt="Banner 1" style="flex: 0 0 auto; width: 100%; max-width: 1000px; height: auto; border-radius: 20px;">
	    <img src="{% static 'images/banners/cred.png' %}" alt="Banner 2" style="flex: 0 0 auto; width: 100%; max-width: 1000px; height: auto; border-radius: 20px;">
	    <img src="{% static 'images/banners/eb.png' %}" alt="Banner 3" style="flex: 0 0 auto; width: 100%; max-width: 1000px; height: auto; border-radius: 20px;">
	  </div>

	  <!-- Hide scrollbar in WebKit browsers -->
	  <style>
	    #carousel::-webkit-scrollbar {
	      display: none;
	    }
	  </style>

	  <!-- Back Arrow Button -->
	  <button onclick="scrollCarousel(-1)" style="position: absolute; top: 50%; left: 10px; transform: translateY(-50%); background-color: rgba(0,0,0,0.5); color: white; font-size: 24px; border: none; padding: 10px; border-radius: 50%; cursor: pointer; z-index: 10;">
	    &#10094;
	  </button>

	  <!-- Next Arrow Button -->
	  <button onclick="scrollCarousel(1)" style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background-color: rgba(0,0,0,0.5); color: white; font-size: 24px; border: none; padding: 10px; border-radius: 50%; cursor: pointer; z-index: 10;">
	    &#10095;
	  </button>

	</div>

	<!-- Scroll Logic -->
	<script>
	  function scrollCarousel(direction) {
	    var carousel = document.getElementById('carousel');
	    var scrollAmount = carousel.offsetWidth + 20; // 20 = gap
	    carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
	  }
	</script>

</div> <!-- container //  -->
</section>
<!-- ========================= SECTION MAIN END// ========================= -->

<!-- ========================= SECTION  ========================= -->
<section class="section-name padding-y-sm">
<div class="container">

<header class="section-heading">
	<a href="{% url 'store' %}" class="btn btn-outline-primary float-right"style="color: purple;border: 1px solid black;" >See all</a>
	<h3 class="section-title">Popular products</h3>
</header><!-- sect-heading -->


<div class="row">
	{% for product in products %}
	<div class="col-md-3">
		<div class="card card-product-grid">
			<a href="{{product.get_url}}" class="img-wrap"> <img src="{{product.images.url}}"> </a>
			<figcaption class="info-wrap">
				<a href="{{product.get_url}}" class="title">{{product.product_name}}</a>
				<div class="price mt-1">{{product.price}}</div> <!-- price-wrap.// -->
			</figcaption>
		</div>
	</div>
	{% endfor %}
	</div>




	 <!-- col.// -->


</div><!-- container // -->
</section>
<!-- ========================= SECTION  END// ========================= -->




<!-- ========================= FOOTER ========================= -->

<!-- ========================= FOOTER END // ========================= -->

</body>
</html>

{% endblock %}
